<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Compare Countries</title>
    <style>
      body{
        background-color: #fff;
        padding-top: 30px;
        
      }

      div {
        margin: 0px auto;
        background-color: #fff;
        width: 400px;
        height: 400px;
        border-radius: 16px;
        box-shadow: 0px 7px 30px 0px rgba(0, 0, 0, 0.3);
        padding: 10px;
        display:flex;
        justify-content:center;
        justify-items: center;
        flex-direction:column;
        
      }
      h2{
        font-family: arial;
        color: #165081;
        text-align: center;
        padding:10px 0px;


      }
      button{
        background-color: #246aa4;
        color:#fff;
        border:0px;
        border-radius: 10px;
        padding:10px 30px;
        margin: 0px auto;
      }
      p{
        font-family: arial;
        color: #333;
        text-align: center;
        padding:10px 0px;
        text-wrap:wrap;

      }
    </style>
  </head>
  <body>
    <div>
      <h2>Afghanistan VS Pakistan </h2>
      <p></p>
      <button id="loadBtn">CLICK TO COMPARE</button>
      <p id="result"></p>
    </div>

    <script src="java.js"></script>
  </body>
</html>
